<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Viewer</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #2E2E2E 0%, #121212 100%);
      font-family: 'Source Sans 3', sans-serif;
    }

    .embedded-viewer {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .viewer-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    #viewer-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .loading-indicator {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #F7F6F3;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .viewer-controls {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.4rem;
      z-index: 10;
    }

    .view-preset,
    .view-reset {
      padding: 0.22rem 0.7rem;
      font-size: 0.48rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(247, 246, 243, 0.05);
      border: 1px solid rgba(199, 168, 106, 0.3);
      border-radius: 24px;
      color: #F7F6F3;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .view-preset:hover,
    .view-reset:hover {
      background: rgba(199, 168, 106, 0.15);
      border-color: #C7A86A;
      color: #C7A86A;
    }

    .viewer-season-toggle {
      position: absolute;
      bottom: 1rem;
      left: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 10;
      font-size: 0.48rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .season-label { color: #F7F6F3; opacity: 0.75; }

    :root {
      --switch-width: 28px;
      --switch-height: 14px;
      --switch-knob: 8px;
      --switch-pad: 3px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: var(--switch-width);
      height: var(--switch-height);
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider-switch {
      position: absolute;
      inset: 0;
      background: rgba(247, 246, 243, 0.1);
      border: 1px solid rgba(199, 168, 106, 0.3);
      border-radius: 99px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .slider-switch::before {
      content: '';
      position: absolute;
      width: var(--switch-knob);
      height: var(--switch-knob);
      background: #C7A86A;
      border-radius: 50%;
      top: 50%;
      left: var(--switch-pad);
      transform: translateY(-50%);
      transition: transform 0.3s ease;
    }

    .switch input:checked + .slider-switch::before {
      transform: translate(calc(var(--switch-width) - var(--switch-knob) - (var(--switch-pad) * 2)), -50%);
    }

    .switch input:checked + .slider-switch {
      background: rgba(199, 168, 106, 0.15);
    }

    .lighting-controls {
      padding: 0 0.75rem;
      height: 3rem;
      background: rgba(0, 0, 0, 0.4);
      border-top: 1px solid rgba(199, 168, 106, 0.15);
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .light-control {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .light-label-text,
    .light-value {
      font-size: 0.48rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(247, 246, 243, 0.6);
      white-space: nowrap;
    }

    .light-value { min-width: 44px; text-align: right; }

    .light-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 2px;
      background: rgba(199, 168, 106, 0.25);
      border-radius: 2px;
      cursor: pointer;
      outline: none;
    }

    .light-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      background: #C7A86A;
      border-radius: 50%;
      border: 2px solid #F7F6F3;
      cursor: pointer;
    }

    .light-slider::-moz-range-thumb {
      width: 13px;
      height: 13px;
      background: #C7A86A;
      border-radius: 50%;
      border: 2px solid #F7F6F3;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="embedded-viewer">
    <div class="viewer-stage">
      <canvas id="viewer-canvas"></canvas>

      <div class="loading-indicator" id="loading-indicator">
        <p>Loading model&hellip;</p>
      </div>

      <div class="viewer-controls">
        <button class="view-reset">Reset View</button>
      </div>

      <div class="viewer-season-toggle">
        <span class="season-label">Winter</span>
        <label class="switch" aria-label="Toggle season">
          <input id="season-toggle" type="checkbox" checked />
          <span class="slider-switch"></span>
        </label>
        <span class="season-label">Summer</span>
      </div>
    </div>

    <div class="lighting-controls">
      <div class="light-control">
        <span class="light-label-text">Sun Position</span>
        <input type="range" id="sun-position-slider" class="light-slider"
               min="0" max="100" value="17" step="1">
        <span class="light-value" id="sun-position-value">Noon</span>
      </div>
    </div>
  </div>

  <script type="module" src="js/viewer-scripts.js"></script>
</body>
</html>
